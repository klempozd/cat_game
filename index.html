<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Fireball Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: crosshair;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #cat {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            transition: transform 0.1s;
        }

        #cat img {
            width: 100%;
            height: 100%;
        }

        .fireball {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
        }

        .fireball svg {
            width: 100%;
            height: 100%;
        }

        .dust {
            position: absolute;
            width: 60px;
            height: 60px;
            pointer-events: none;
            animation: dustExplosion 0.6s ease-out forwards;
        }

        .dust svg {
            width: 100%;
            height: 100%;
        }

        @keyframes dustExplosion {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* Border indicators */
        .border {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .border.top {
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
        }

        .border.bottom {
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
        }

        .border.left {
            top: 0;
            left: 0;
            bottom: 0;
            width: 2px;
        }

        .border.right {
            top: 0;
            right: 0;
            bottom: 0;
            width: 2px;
        }

        /* Solo mode: scoreboard */
        #scoreboard {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            user-select: none;
        }

        /* Solo mode: smiley targets */
        .smiley {
            position: absolute;
            width: 128px;
            height: 128px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.3));
        }

        .smiley svg {
            width: 100%;
            height: 100%;
        }

        /* Remaining-hits badge on each smiley */
        .smiley .count {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 32px;
            height: 32px;
            padding: 0 7px;
            border-radius: 999px;
            background: #ff4444;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 17px;
            font-weight: 800;
            line-height: 32px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
        }

        /* Solo mode: round announcement banner */
        #banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 72px;
            font-weight: 800;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #banner.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Border indicators -->
        <div class="border top"></div>
        <div class="border bottom"></div>
        <div class="border left"></div>
        <div class="border right"></div>

        <!-- Scoreboard (solo mode) -->
        <div id="scoreboard">Round 1</div>

        <!-- Cat element -->
        <div id="cat">
            <img src="images/cat.svg" alt="cat">
        </div>

        <!-- Round announcement banner (solo mode) -->
        <div id="banner"></div>
    </div>

    <!-- Template SVGs (hidden) -->
    <div style="display: none;">
        <!-- Fireball SVG template -->
        <svg id="fireball-template" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="#ff4444"/>
            <circle cx="50" cy="50" r="35" fill="#ff8800"/>
            <circle cx="50" cy="50" r="25" fill="#ffcc00"/>
        </svg>

        <!-- Dust SVG template -->
        <svg id="dust-template" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="30" cy="30" r="15" fill="#999" opacity="0.6"/>
            <circle cx="70" cy="40" r="20" fill="#bbb" opacity="0.5"/>
            <circle cx="50" cy="70" r="18" fill="#888" opacity="0.6"/>
            <circle cx="40" cy="50" r="12" fill="#aaa" opacity="0.5"/>
        </svg>

        <!-- Smiley SVG template -->
        <svg id="smiley-template" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="46" fill="#ffd23f" stroke="#e6a700" stroke-width="3"/>
            <circle cx="36" cy="40" r="6" fill="#333"/>
            <circle cx="64" cy="40" r="6" fill="#333"/>
            <path d="M30 58 Q50 80 70 58" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const cat = document.getElementById('cat');
        const fireballs = [];

        // --- Solo mode: bouncing smiley targets that escalate each round ---
        const scoreboard = document.getElementById('scoreboard');
        const banner = document.getElementById('banner');

        const HITS_PER_SMILEY = 10;
        const SMILEY_SIZE = 128;
        const SMILEY_RADIUS = SMILEY_SIZE / 2;
        const FIREBALL_RADIUS = 20;
        const SMILEY_SPEED = 4;

        let round = 0;
        let gameActive = true;
        let bannerTimer = null;
        const smileys = [];

        // Get cat center position
        function getCatPosition() {
            const rect = cat.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        // Create fireball element
        function createFireball(startX, startY, targetX, targetY) {
            const fireball = document.createElement('div');
            fireball.className = 'fireball';
            fireball.style.left = startX + 'px';
            fireball.style.top = startY + 'px';

            // Clone the fireball SVG
            const svg = document.getElementById('fireball-template').cloneNode(true);
            svg.removeAttribute('id');
            fireball.appendChild(svg);

            gameContainer.appendChild(fireball);

            // Calculate direction and speed
            const dx = targetX - startX;
            const dy = targetY - startY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const speed = 5; // pixels per frame

            const velocityX = (dx / distance) * speed;
            const velocityY = (dy / distance) * speed;

            return {
                element: fireball,
                x: startX,
                y: startY,
                vx: velocityX,
                vy: velocityY
            };
        }

        // Create dust explosion
        function createDust(x, y) {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = (x - 30) + 'px'; // Center the dust
            dust.style.top = (y - 30) + 'px';

            // Clone the dust SVG
            const svg = document.getElementById('dust-template').cloneNode(true);
            svg.removeAttribute('id');
            dust.appendChild(svg);

            gameContainer.appendChild(dust);

            // Remove after animation
            setTimeout(() => {
                dust.remove();
            }, 600);
        }

        // --- Smiley target helpers ---

        // Build a smiley DOM element with a remaining-hits badge
        function createSmileyElement() {
            const el = document.createElement('div');
            el.className = 'smiley';

            const svg = document.getElementById('smiley-template').cloneNode(true);
            svg.removeAttribute('id');
            el.appendChild(svg);

            const count = document.createElement('span');
            count.className = 'count';
            el.appendChild(count);

            gameContainer.appendChild(el);
            return { el, count };
        }

        // Spawn one smiley at a random spot with a random Pong-style velocity
        function spawnSmiley() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const { el, count } = createSmileyElement();

            const angle = Math.random() * Math.PI * 2;
            const smiley = {
                x: SMILEY_RADIUS + Math.random() * (w - SMILEY_SIZE),
                y: SMILEY_RADIUS + Math.random() * (h - SMILEY_SIZE),
                vx: Math.cos(angle) * SMILEY_SPEED,
                vy: Math.sin(angle) * SMILEY_SPEED,
                hitsLeft: HITS_PER_SMILEY,
                element: el,
                countEl: count
            };

            count.textContent = smiley.hitsLeft;
            smiley.element.style.left = smiley.x + 'px';
            smiley.element.style.top = smiley.y + 'px';
            smileys.push(smiley);
        }

        // Move a smiley and bounce it off the walls (Pong-style)
        function updateSmiley(s) {
            s.x += s.vx;
            s.y += s.vy;

            const w = window.innerWidth;
            const h = window.innerHeight;

            if (s.x <= SMILEY_RADIUS) {
                s.x = SMILEY_RADIUS;
                s.vx = Math.abs(s.vx);
            } else if (s.x >= w - SMILEY_RADIUS) {
                s.x = w - SMILEY_RADIUS;
                s.vx = -Math.abs(s.vx);
            }

            if (s.y <= SMILEY_RADIUS) {
                s.y = SMILEY_RADIUS;
                s.vy = Math.abs(s.vy);
            } else if (s.y >= h - SMILEY_RADIUS) {
                s.y = h - SMILEY_RADIUS;
                s.vy = -Math.abs(s.vy);
            }

            s.element.style.left = s.x + 'px';
            s.element.style.top = s.y + 'px';
        }

        // Does this fireball overlap the given smiley?
        function hitsSmiley(fireball, s) {
            const cx = fireball.x + FIREBALL_RADIUS;
            const cy = fireball.y + FIREBALL_RADIUS;
            return Math.hypot(cx - s.x, cy - s.y) < SMILEY_RADIUS + FIREBALL_RADIUS;
        }

        // Register a hit on a smiley; clears it (and advances the round) when drained
        function registerSmileyHit(s) {
            s.hitsLeft--;

            if (s.hitsLeft > 0) {
                s.countEl.textContent = s.hitsLeft;
                return;
            }

            // This smiley is done — remove it
            s.element.remove();
            const idx = smileys.indexOf(s);
            if (idx !== -1) smileys.splice(idx, 1);
            updateScoreboard();

            // Cleared them all? You win the round — one more smiley appears next round
            if (smileys.length === 0) {
                startRound(round + 1);
            }
        }

        function updateScoreboard() {
            const left = smileys.length;
            scoreboard.textContent = `Round ${round} · ${left} smiley${left === 1 ? '' : 's'} left`;
        }

        // Flash a short message in the center of the screen
        function showBanner(text) {
            banner.textContent = text;
            banner.classList.add('show');
            if (bannerTimer) clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => banner.classList.remove('show'), 1100);
        }

        // Start round n: clear any leftovers and spawn n fresh smileys
        function startRound(n) {
            round = n;
            for (const s of smileys) s.element.remove();
            smileys.length = 0;
            for (let i = 0; i < n; i++) spawnSmiley();
            updateScoreboard();
            showBanner('Round ' + n);
        }

        // Check collision with borders
        function checkBorderCollision(fireball) {
            const margin = 20; // Collision distance from edge

            if (fireball.x <= margin ||
                fireball.x >= window.innerWidth - margin ||
                fireball.y <= margin ||
                fireball.y >= window.innerHeight - margin) {
                return true;
            }
            return false;
        }

        // Animation loop
        function animate() {
            if (gameActive) {
                for (const s of smileys) updateSmiley(s);
            }

            for (let i = fireballs.length - 1; i >= 0; i--) {
                const fireball = fireballs[i];

                // Update position
                fireball.x += fireball.vx;
                fireball.y += fireball.vy;

                fireball.element.style.left = fireball.x + 'px';
                fireball.element.style.top = fireball.y + 'px';

                // Hit one of the smileys?
                let hitSmiley = null;
                if (gameActive) {
                    for (const s of smileys) {
                        if (hitsSmiley(fireball, s)) {
                            hitSmiley = s;
                            break;
                        }
                    }
                }

                if (hitSmiley) {
                    createDust(hitSmiley.x, hitSmiley.y);
                    fireball.element.remove();
                    fireballs.splice(i, 1);
                    registerSmileyHit(hitSmiley);
                    continue;
                }

                // Check border collision
                if (checkBorderCollision(fireball)) {
                    // Create dust at collision point
                    createDust(fireball.x, fireball.y);

                    // Remove fireball
                    fireball.element.remove();
                    fireballs.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Handle clicks
        gameContainer.addEventListener('click', (e) => {
            if (!gameActive) return;

            const catPos = getCatPosition();
            const targetX = e.clientX;
            const targetY = e.clientY;

            // Create and launch fireball
            const fireball = createFireball(catPos.x, catPos.y, targetX, targetY);
            fireballs.push(fireball);

            // Optional: Make cat look at click direction
            const angle = Math.atan2(targetY - catPos.y, targetX - catPos.x);
            const degrees = angle * (180 / Math.PI);
            cat.style.transform = `translate(-50%, -50%) rotate(${degrees}deg)`;

            // Reset cat rotation after a short delay
            setTimeout(() => {
                cat.style.transform = 'translate(-50%, -50%)';
            }, 200);
        });

        // Start the game
        startRound(1);
        animate();
    </script>
</body>
</html>
