<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Fireball Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: crosshair;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #cat {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            transition: transform 0.1s;
        }

        #cat img {
            width: 100%;
            height: 100%;
        }

        .fireball {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
        }

        .fireball svg {
            width: 100%;
            height: 100%;
        }

        .dust {
            position: absolute;
            width: 60px;
            height: 60px;
            pointer-events: none;
            animation: dustExplosion 0.6s ease-out forwards;
        }

        .dust svg {
            width: 100%;
            height: 100%;
        }

        @keyframes dustExplosion {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* Border indicators */
        .border {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .border.top {
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
        }

        .border.bottom {
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
        }

        .border.left {
            top: 0;
            left: 0;
            bottom: 0;
            width: 2px;
        }

        .border.right {
            top: 0;
            right: 0;
            bottom: 0;
            width: 2px;
        }

        /* Solo mode: scoreboard */
        #scoreboard {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            user-select: none;
        }

        /* Solo mode: smiley target */
        #target {
            position: absolute;
            width: 64px;
            height: 64px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.3));
        }

        #target svg {
            width: 100%;
            height: 100%;
        }

        /* Solo mode: win screen */
        #win-screen {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
        }

        #win-screen.hidden {
            display: none;
        }

        .win-card {
            background: #fff;
            padding: 40px 56px;
            border-radius: 18px;
            text-align: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .win-card h1 {
            color: #764ba2;
            font-size: 40px;
            margin-bottom: 8px;
        }

        .win-card p {
            color: #555;
            margin-bottom: 24px;
            font-size: 18px;
        }

        .win-card button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .win-card button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Border indicators -->
        <div class="border top"></div>
        <div class="border bottom"></div>
        <div class="border left"></div>
        <div class="border right"></div>

        <!-- Scoreboard (solo mode) -->
        <div id="scoreboard">Hits: 0 / 10</div>

        <!-- Cat element -->
        <div id="cat">
            <img src="images/cat.svg" alt="cat">
        </div>

        <!-- Smiley target (solo mode) -->
        <div id="target">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="#ffd23f" stroke="#e6a700" stroke-width="3"/>
                <circle cx="36" cy="40" r="6" fill="#333"/>
                <circle cx="64" cy="40" r="6" fill="#333"/>
                <path d="M30 58 Q50 80 70 58" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Win screen (solo mode) -->
        <div id="win-screen" class="hidden">
            <div class="win-card">
                <h1>You Win! 🎉</h1>
                <p>You hit the smiley 10 times.</p>
                <button id="play-again">Play Again</button>
            </div>
        </div>
    </div>

    <!-- Template SVGs (hidden) -->
    <div style="display: none;">
        <!-- Fireball SVG template -->
        <svg id="fireball-template" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="#ff4444"/>
            <circle cx="50" cy="50" r="35" fill="#ff8800"/>
            <circle cx="50" cy="50" r="25" fill="#ffcc00"/>
        </svg>

        <!-- Dust SVG template -->
        <svg id="dust-template" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="30" cy="30" r="15" fill="#999" opacity="0.6"/>
            <circle cx="70" cy="40" r="20" fill="#bbb" opacity="0.5"/>
            <circle cx="50" cy="70" r="18" fill="#888" opacity="0.6"/>
            <circle cx="40" cy="50" r="12" fill="#aaa" opacity="0.5"/>
        </svg>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const cat = document.getElementById('cat');
        const fireballs = [];

        // --- Solo mode: moving smiley target + scoring ---
        const targetEl = document.getElementById('target');
        const scoreboard = document.getElementById('scoreboard');
        const winScreen = document.getElementById('win-screen');
        const playAgainBtn = document.getElementById('play-again');

        const WIN_SCORE = 10;
        const TARGET_SIZE = 64;
        const TARGET_RADIUS = TARGET_SIZE / 2;
        const FIREBALL_RADIUS = 20;

        let score = 0;
        let gameActive = true;

        const target = { x: 0, y: 0, vx: 0, vy: 0 };

        // Get cat center position
        function getCatPosition() {
            const rect = cat.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        // Create fireball element
        function createFireball(startX, startY, targetX, targetY) {
            const fireball = document.createElement('div');
            fireball.className = 'fireball';
            fireball.style.left = startX + 'px';
            fireball.style.top = startY + 'px';
            
            // Clone the fireball SVG
            const svg = document.getElementById('fireball-template').cloneNode(true);
            svg.removeAttribute('id');
            fireball.appendChild(svg);
            
            gameContainer.appendChild(fireball);

            // Calculate direction and speed
            const dx = targetX - startX;
            const dy = targetY - startY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const speed = 5; // pixels per frame
            
            const velocityX = (dx / distance) * speed;
            const velocityY = (dy / distance) * speed;

            return {
                element: fireball,
                x: startX,
                y: startY,
                vx: velocityX,
                vy: velocityY
            };
        }

        // Create dust explosion
        function createDust(x, y) {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = (x - 30) + 'px'; // Center the dust
            dust.style.top = (y - 30) + 'px';
            
            // Clone the dust SVG
            const svg = document.getElementById('dust-template').cloneNode(true);
            svg.removeAttribute('id');
            dust.appendChild(svg);
            
            gameContainer.appendChild(dust);

            // Remove after animation
            setTimeout(() => {
                dust.remove();
            }, 600);
        }

        // --- Solo target helpers ---

        // Place the smiley at a random spot with a random Pong-style velocity
        function spawnTarget() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            target.x = TARGET_RADIUS + Math.random() * (w - TARGET_SIZE);
            target.y = TARGET_RADIUS + Math.random() * (h - TARGET_SIZE);

            const speed = 4;
            const angle = Math.random() * Math.PI * 2;
            target.vx = Math.cos(angle) * speed;
            target.vy = Math.sin(angle) * speed;

            drawTarget();
        }

        function drawTarget() {
            targetEl.style.left = target.x + 'px';
            targetEl.style.top = target.y + 'px';
        }

        // Move the target and bounce it off the walls (Pong-style)
        function updateTarget() {
            target.x += target.vx;
            target.y += target.vy;

            const w = window.innerWidth;
            const h = window.innerHeight;

            if (target.x <= TARGET_RADIUS) {
                target.x = TARGET_RADIUS;
                target.vx = Math.abs(target.vx);
            } else if (target.x >= w - TARGET_RADIUS) {
                target.x = w - TARGET_RADIUS;
                target.vx = -Math.abs(target.vx);
            }

            if (target.y <= TARGET_RADIUS) {
                target.y = TARGET_RADIUS;
                target.vy = Math.abs(target.vy);
            } else if (target.y >= h - TARGET_RADIUS) {
                target.y = h - TARGET_RADIUS;
                target.vy = -Math.abs(target.vy);
            }

            drawTarget();
        }

        // Does this fireball overlap the target?
        function hitsTarget(fireball) {
            const cx = fireball.x + FIREBALL_RADIUS;
            const cy = fireball.y + FIREBALL_RADIUS;
            const dx = cx - target.x;
            const dy = cy - target.y;
            return Math.hypot(dx, dy) < TARGET_RADIUS + FIREBALL_RADIUS;
        }

        function updateScoreboard() {
            scoreboard.textContent = `Hits: ${score} / ${WIN_SCORE}`;
        }

        function registerHit() {
            score++;
            updateScoreboard();
            if (score >= WIN_SCORE) {
                gameActive = false;
                winScreen.classList.remove('hidden');
            } else {
                spawnTarget();
            }
        }

        function resetGame() {
            score = 0;
            updateScoreboard();
            for (const fb of fireballs) fb.element.remove();
            fireballs.length = 0;
            winScreen.classList.add('hidden');
            spawnTarget();
            gameActive = true;
        }

        // Check collision with borders
        function checkBorderCollision(fireball) {
            const margin = 20; // Collision distance from edge
            
            if (fireball.x <= margin || 
                fireball.x >= window.innerWidth - margin || 
                fireball.y <= margin || 
                fireball.y >= window.innerHeight - margin) {
                return true;
            }
            return false;
        }

        // Animation loop
        function animate() {
            if (gameActive) {
                updateTarget();
            }

            for (let i = fireballs.length - 1; i >= 0; i--) {
                const fireball = fireballs[i];

                // Update position
                fireball.x += fireball.vx;
                fireball.y += fireball.vy;

                fireball.element.style.left = fireball.x + 'px';
                fireball.element.style.top = fireball.y + 'px';

                // Hit the moving target?
                if (gameActive && hitsTarget(fireball)) {
                    createDust(target.x, target.y);
                    fireball.element.remove();
                    fireballs.splice(i, 1);
                    registerHit();
                    continue;
                }

                // Check border collision
                if (checkBorderCollision(fireball)) {
                    // Create dust at collision point
                    createDust(fireball.x, fireball.y);

                    // Remove fireball
                    fireball.element.remove();
                    fireballs.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Handle clicks
        gameContainer.addEventListener('click', (e) => {
            if (!gameActive) return;

            const catPos = getCatPosition();
            const targetX = e.clientX;
            const targetY = e.clientY;

            // Create and launch fireball
            const fireball = createFireball(catPos.x, catPos.y, targetX, targetY);
            fireballs.push(fireball);

            // Optional: Make cat look at click direction
            const angle = Math.atan2(targetY - catPos.y, targetX - catPos.x);
            const degrees = angle * (180 / Math.PI);
            cat.style.transform = `translate(-50%, -50%) rotate(${degrees}deg)`;
            
            // Reset cat rotation after a short delay
            setTimeout(() => {
                cat.style.transform = 'translate(-50%, -50%)';
            }, 200);
        });

        // Play again resets the round
        playAgainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
        });

        // Start the round
        updateScoreboard();
        spawnTarget();
        animate();
    </script>
</body>
</html>
